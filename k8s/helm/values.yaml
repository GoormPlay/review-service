image:
  repository: roin09/review-service
  tag: latest

service:
  port: 80
  targetPort: 8087

env:
  useConfigMap: true
  useSecret: true

replicaCount: 1

ingress:
  enabled: false

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStore:
    name: aws-secrets
    kind: ClusterSecretStore
  dataFromKey: review-service-secret

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-type
              operator: In
              values:
                - medium

resources:
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 512Mi
